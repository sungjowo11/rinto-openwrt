name: Build HG680P ImmortalWrt (Minimal + OpenClash + Tailscale)

on:
  workflow_dispatch:
    inputs:
      releases_branch:
        description: "Select ImmortalWrt release"
        required: false
        default: "immortalwrt:24.10.6"
        type: choice
        options:
          - immortalwrt:24.10.6
          - immortalwrt:25.12.2
          - openwrt:24.10.8
      openwrt_board:
        description: "Select device board"
        required: false
        default: "s905x"
        type: choice
        options:
          - s905x
          - s905x-b860h
      openwrt_kernel:
        description: "Select kernel version"
        required: false
        default: "5.15.y"
        type: choice
        options:
          - 5.15.y
          - 6.1.y
          - 6.6.y
      openwrt_ip:
        description: "Set default LAN IP address"
        required: false
        default: "192.168.1.1"

env:
  TZ: Asia/Jakarta
  IMAGEBUILDER_SH: scripts/build-imagebuilder.sh

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Prepare Build Environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift 2>/dev/null || true
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo apt-get -y install zstd xz-utils curl jq tar gzip pigz
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "${TZ:-Asia/Jakarta}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create Extended Virtual Disk
        id: disk
        run: |
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Insufficient space"; exit 1; }
          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Build Rootfs using ImageBuilder
        id: imagebuilder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          RELEASES_BRANCH="${{ inputs.releases_branch }}"
          chmod +x ${IMAGEBUILDER_SH}
          ${IMAGEBUILDER_SH} "${RELEASES_BRANCH}"
          echo "build_tag=HG680P_ImmortalWrt_${RELEASES_BRANCH/:/_}_$(date +"%Y.%m.%d-%H%M")" >> ${GITHUB_ENV}
          [[ -d "/builder/openwrt" ]] || mkdir -p /builder/openwrt
          ln -sf /builder/openwrt /home/runner/work/_actions/ophub/amlogic-s9xxx-openwrt/main/openwrt 2>/dev/null || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Package Firmware for HG680P (Amlogic S905X)
        if: ${{ steps.imagebuilder.outputs.status == 'success' && !cancelled() }}
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: output/*rootfs.tar.gz
          openwrt_ip: ${{ inputs.openwrt_ip }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: false
          kernel_repo: ophub/kernel
          kernel_usage: stable
          builder_name: rinto-openwrt

      - name: Upload Firmware to GitHub Releases
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 🚀 HG680P Minimal ImmortalWrt Firmware
            - **Base**: ${{ inputs.releases_branch }}
            - **Target SoC**: Amlogic S905X (`${{ inputs.openwrt_board }}`)
            - **Kernel**: ${{ inputs.openwrt_kernel }}
            - **Default LAN IP**: `${{ inputs.openwrt_ip }}`
            - **Default Username**: `root`
            - **Default Password**: `password` (atau kosongkan saat first boot)
            - **Default WiFi**: `HG680P-OpenWrt` (No Password)

            #### Included Features:
            - **No-Bloatware**: Stripped out Docker, Samba, Transmission, Torrent, DLNA.
            - **luci-app-openclash**: Pre-installed with Mihomo (Clash.Meta) core.
            - **tailscale**: Subnet router & IP forwarding pre-configured (`net.ipv4.ip_forward = 1`).
            - **luci-app-amlogic**: Tool install/update firmware ke eMMC internal.
            - **zram-swap**: Memory optimizer untuk RAM 1GB / 2GB.
